<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilan hydrique | Calculateur hydro-agricole</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2317324d'/%3E%3Cpath d='M50 20 C35 45 25 55 25 68 A25 25 0 0 0 75 68 C75 55 65 45 50 20Z' fill='%231d6f5b'/%3E%3C/svg%3E">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  .font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared.js"></script>
<script type="text/babel">

function BalanceContent() {
  const initLive = loadLive();
  const largeur = initLive.largeur || 100;
  const longueur = initLive.longueur || 100;
  const { table: monthlyTable, superficie } = computeBilanTable(initLive.bilanInputs, largeur, longueur);
  const designData = getDesignData(initLive);
  const qParcelle = designData ? designData.qParcelleRetenu : null;

  const [monthIdx, setMonthIdx] = useState(0);
  const [dailyRain, setDailyRain] = useState(Array(30).fill(0));
  const [jourChoisi, setJourChoisi] = useState(2);

  const monthly = useMemo(() => {
    if (!monthlyTable) return [];
    return monthlyTable.map(r => {
      const etoM3 = r.etoMois * 10 * (superficie / 10000);
      const doseBruteM3 = r.doseBrute * 30;
      const besoinNetM3 = doseBruteM3 - etoM3;
      return { month: r.month, etoM3, doseBruteM3, besoinNetM3, etcM3j: r.etcM3j };
    });
  }, [monthlyTable, superficie]);

  const selected = monthlyTable ? monthlyTable[monthIdx] : null;

  const dailyCalc = useMemo(() => {
    return dailyRain.map((p, i) => {
      const pEff = pluieEfficace(p);
      const pM3 = p * 10 * (superficie / 10000);
      const pEffM3 = pEff * 10 * (superficie / 10000);
      return { jour: i + 1, p, pEff, pM3, pEffM3 };
    });
  }, [dailyRain, superficie]);

  const decision = useMemo(() => {
    if (!selected || !dailyCalc[jourChoisi - 1]) return null;
    const pluieJourM3 = dailyCalc[jourChoisi - 1].pEffM3;
    const besoinJourM3 = selected.doseBrute;
    if (pluieJourM3 >= besoinJourM3) {
      const joursSansIrriguer = Math.floor(pluieJourM3 / besoinJourM3);
      return { irriguer: false, joursSansIrriguer, pluieJourM3, besoinJourM3 };
    } else {
      const manque = besoinJourM3 - pluieJourM3;
      const dureeH = qParcelle ? manque / qParcelle : null;
      return { irriguer: true, manque, dureeH, pluieJourM3, besoinJourM3 };
    }
  }, [selected, dailyCalc, jourChoisi, qParcelle]);

  const updateRain = (i, val) => {
    const next = [...dailyRain];
    next[i] = val === "" ? 0 : parseFloat(val);
    setDailyRain(next);
  };

  if (!initLive.bilanInputs) {
    return (
      <div className="min-h-screen bg-[#f5f8f6]">
        <PageHeader title="Bilan hydrique" />
        <PageNav current="bilan-hydrique.html" />
        <main className="max-w-5xl mx-auto px-6 py-8">
          <p className="text-sm text-[#60707d]">Renseigne d'abord la page « Bilan sol-eau-culture » pour activer ce module.</p>
        </main>
        <PageFooter />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-[#f5f8f6]">
      <PageHeader title="Bilan hydrique" />
      <PageNav current="bilan-hydrique.html" />
      <main className="max-w-5xl mx-auto px-6 py-8">

        <div className="rounded-xl border border-[#dce5e1] bg-white p-4 mb-6">
          <div className="text-xs font-semibold text-[#60707d] mb-3">BILAN MENSUEL — ETo + Besoin net (aires empilées) vs Dose brute (diagramme, m³)</div>
          <StackedAreaChart monthly={monthly} />
          <div className="flex gap-4 mt-3 text-xs text-[#60707d]">
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-[#8fceb4] border border-[#1d6f5b] inline-block"></span>Besoin net (empilé)</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-[#f6c893] border border-[#d98f4e] inline-block"></span>ETo (empilé)</span>
            <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm bg-[#3f6f96] inline-block"></span>Dose brute</span>
          </div>
          <p className="text-[11px] text-[#60707d] mt-2">La hauteur cumulée de l'aire empilée (ETo + Besoin net) doit coïncider avec le diagramme Dose brute — c'est la vérification visuelle de cohérence du bilan.</p>
        </div>

        <div className="grid md:grid-cols-3 gap-4 mb-4">
          <Field label="Mois">
            <Select value={monthlyTable[monthIdx].month} onChange={(v)=>setMonthIdx(MONTHS.indexOf(v))} options={MONTHS} />
          </Field>
          <Field label="Jour du mois" hint="Jour dont on regarde la pluie">
            <NumberInput value={jourChoisi} onChange={setJourChoisi} step="1" />
          </Field>
          <Field label="Débit parcelle" unit="m³/h" hint="Auto — depuis Conception réseau">
            <div className="w-full rounded-lg border border-[#dce5e1] bg-[#f5f8f6] px-3 py-2 font-mono text-[#60707d]">{qParcelle ? qParcelle.toFixed(3) : "—"}</div>
          </Field>
        </div>

        {decision && (
          <div className={`rounded-lg border px-4 py-3 mb-6 text-sm font-medium ${decision.irriguer ? "bg-[#fdf1e7] border-[#eccaa8] text-[#7a4a1f]" : "bg-[#eaf3ef] border-[#c9dcd3] text-[#2a4a3d]"}`}>
            {decision.irriguer
              ? `→ Irriguer pendant ${fmtDuree(decision.dureeH)} (pluie efficace du jour ${jourChoisi} : ${decision.pluieJourM3.toFixed(3)} m³, insuffisante face au besoin du jour : ${decision.besoinJourM3.toFixed(4)} m³)`
              : `→ ${decision.joursSansIrriguer} jour(s) sans irriguer (pluie efficace du jour ${jourChoisi} : ${decision.pluieJourM3.toFixed(3)} m³, couvre le besoin du jour : ${decision.besoinJourM3.toFixed(4)} m³)`}
          </div>
        )}

        <div className="overflow-x-auto rounded-xl border border-[#dce5e1]">
          <table className="w-full text-sm">
            <thead className="bg-[#17324d] text-white">
              <tr>
                <th className="text-left px-3 py-2 font-medium">Jour</th>
                <th className="text-left px-3 py-2 font-medium">Pluie (mm)</th>
                <th className="text-left px-3 py-2 font-medium">Pluie efficace (mm)</th>
                <th className="text-left px-3 py-2 font-medium">Pluie efficace (m³)</th>
              </tr>
            </thead>
            <tbody>
              {dailyCalc.map((d, i) => (
                <tr key={d.jour} className={i % 2 ? "bg-[#f5f8f6]" : "bg-white"}>
                  <td className="px-3 py-1 font-medium text-[#17324d]">{d.jour}</td>
                  <td className="px-2 py-1">
                    <input type="number" value={dailyRain[i]} onChange={(e)=>updateRain(i, e.target.value)}
                      className="w-16 rounded border border-[#dce5e1] px-2 py-0.5 font-mono text-[#17324d]" />
                  </td>
                  <td className="px-3 py-1 font-mono text-[#60707d]">{d.pEff.toFixed(1)}</td>
                  <td className="px-3 py-1 font-mono font-semibold text-[#1d6f5b]">{d.pEffM3.toFixed(4)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="text-xs text-[#60707d] mt-3">
          Saisis la pluie journalière (mm) du mois, choisis un jour : la décision d'irriguer (ou non) ci-dessus utilise la
          pluie EFFICACE (après seuils) comparée au besoin journalier (m³/j) du mois choisi.
        </p>

      </main>
      <PageFooter />
    </div>
  );
}

function Root() {
  return <IdentityGate><BalanceContent /></IdentityGate>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
